name: CI

on:
  push:
    branches: [main, "v*/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  # Pinned on purpose: `goreleaser check` fails on deprecated settings, so a
  # floating version could turn the build red with no change in the repo.
  # Bump it deliberately, together with .goreleaser.yaml if needed.
  GORELEASER_VERSION: "v2.18.2"

jobs:
  # macOS and Windows are both first-class targets (see docs/design/product.md).
  # A change is not done if its tests only run on one OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # The shells the shell-integration tests must run in. A shell listed
        # here that is missing fails the tests instead of skipping them. On
        # Windows only PowerShell is supported.
        include:
          - os: macos-latest
            shells: zsh,bash,fish,pwsh
          - os: ubuntu-latest
            shells: zsh,bash,fish,pwsh
          - os: windows-latest
            shells: pwsh
    env:
      WT_TEST_SHELLS: ${{ matrix.shells }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The runners bring bash and pwsh, and zsh on macOS. bash-completion
      # 1.x is the one the system bash of macOS (3.2) supports.
      - name: install shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish bash-completion

      - name: install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish bash-completion

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The race detector needs a C toolchain on Windows; skip it there.
      - name: test
        if: matrix.os == 'windows-latest'
        run: go test ./...

      - name: test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race ./...

  # Cross-compilation is a product requirement, not an afterthought: the daily
  # development machine is macOS and the daily use machine is Windows. The
  # targets live in .goreleaser.yaml, so CI builds exactly what a release
  # publishes. The job keeps its name: it is a required check on main.
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean
