name: CI

on:
  push:
    branches: [main, "v1/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  # macOS and Windows are both first-class targets (see docs/design/product.md).
  # A change is not done if its tests only run on one OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The race detector needs a C toolchain on Windows; skip it there.
      - name: test
        if: matrix.os == 'windows-latest'
        run: go test ./...

      - name: test (race)
        if: matrix.os != 'windows-latest'
        run: go test -race ./...

  # Cross-compilation is a product requirement, not an afterthought: the daily
  # development machine is macOS and the daily use machine is Windows.
  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build all targets
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null ./cmd/git-wt
            echo "ok  $target"
          done
